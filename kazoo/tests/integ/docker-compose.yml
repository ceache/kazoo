volumes:
  # kdc_data_vol:
  #   driver_opts:
  #     type: tmpfs
  #     device: tmpfs

  zoo1_data_vol:
    driver_opts:
      type: tmpfs
      device: tmpfs

  zoo2_data_vol:
    driver_opts:
      type: tmpfs
      device: tmpfs

  zoo3_data_vol:
    driver_opts:
      type: tmpfs
      device: tmpfs

x-zoo-environment: &zoo_env
  ZOO_4LW_COMMANDS_WHITELIST: "*"
  # Zk 3.8+ Logback uses ZOO_LOG_DIR and JVMFLAGS for config
  ZOO_LOG_DIR: "/logs"
  # Enable extended types, authentication (super user), and logback config
  SERVER_JVMFLAGS: >-
    -Dzookeeper.DigestAuthenticationProvider.superDigest="super:D/InIHSb7yEEbrWz8b9l71RjZJU="
    -Dzookeeper.extendedTypesEnabled=true
    -Dzookeeper.root.logger=INFO,CONSOLE,ROLLINGFILE
  # Zk 3.7 LOG4J write logs to /logs/zookeeper.log
  ZOO_LOG4J_PROP: "DEBUG,ROLLINGFILE"

x-zoo-healthcheck: &zoo_healthcheck
  test:
    [
      "CMD-SHELL",
      "echo 'srvr' | nc localhost 2181 | grep -q 'Zookeeper version'",
    ]
  interval: 10s
  timeout: 5s
  retries: 3

services:
  # kdc:
  #   build:
  #     context: ../dockerfiles/kdc
  #     dockerfile: Dockerfile
  #   container_name: kdc
  #   image: kdc-latest
  #   hostname: kdc
  #   ports:
  #     - 1088:1088
  #   environment:
  #     SPNS: "client server/zoo1 server/zoo2 server/zoo3"
  #   volumes:
  #     - kdc_data_vol:/kdc-data

  zoo1:
    image: zookeeper:${ZK_VERSION}
    container_name: zoo1
    restart: always
    hostname: zoo1
    ports:
      - 0:2181
    healthcheck: *zoo_healthcheck
    environment:
      <<: *zoo_env
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=0.0.0.0:2888:3888;2181 server.2=zoo2:2888:3888;2181 server.3=zoo3:2888:3888;2181
    volumes:
      - zoo1_data_vol:/data
      - ${ZK_WORK_DIR}/logs/zk1:/logs
      #- kdc_data_vol:/kdc-data
    tmpfs:
      - "/datalog"
    #depends_on:
    #  - kdc

  zoo2:
    image: zookeeper:${ZK_VERSION}
    container_name: zoo2
    restart: always
    hostname: zoo2
    ports:
      - 0:2181
    environment:
      <<: *zoo_env
      ZOO_MY_ID: 2
      ZOO_SERVERS: server.1=zoo1:2888:3888;2181 server.2=0.0.0.0:2888:3888;2181 server.3=zoo3:2888:3888;2181
    healthcheck: *zoo_healthcheck
    volumes:
      - zoo2_data_vol:/data
      - ${ZK_WORK_DIR}/logs/zk2:/logs
      #- kdc_data_vol:/kdc-data
    tmpfs:
      - "/datalog"
    #depends_on:
    #  - kdc

  zoo3:
    image: zookeeper:${ZK_VERSION}
    container_name: zoo3
    restart: always
    hostname: zoo3
    ports:
      - 0:2181
    environment:
      <<: *zoo_env
      ZOO_MY_ID: 3
      ZOO_SERVERS: server.1=zoo1:2888:3888;2181 server.2=zoo2:2888:3888;2181 server.3=0.0.0.0:2888:3888;2181
    healthcheck: *zoo_healthcheck
    volumes:
      - zoo3_data_vol:/data
      - ${ZK_WORK_DIR}/logs/zk3:/logs
      #- kdc_data_vol:/kdc-data
    tmpfs:
      - "/datalog"
    #depends_on:
    #  - kdc

