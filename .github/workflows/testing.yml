name: Kazoo Awesome Testing

on:
  push:
    branches:
      - master
      - release/*
  pull_request:
    branches:
      - master
      - release/*

jobs:
  validate:
    name: Code Validation

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Handle pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', 'pyproject.toml', 'setup.cfg', 'tox.ini') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install required dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install tox

      - name: Code check
        run: tox -e ${TOX_VENV}
        env:
          TOX_VENV: black,pep8,mypy

  test:
    needs: [validate]

    name: >
      Linux - Test Python ${{ matrix.python-version }},
      ZK ${{ matrix.zk-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Tiered matrix (FR-017): every supported Python interpreter runs the
        # full suite (unit + integ) against each supported ZooKeeper version on
        # the plain auth/feature axis. The auth and feature axes run separately
        # (test_axes) on the latest Python target to keep the combinatorial
        # cost bounded (SC-007).
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "pypy-3.11-v7.3.21"]
        zk-version: ["3.7.2", "3.8.6", "3.9.5"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Handle pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', 'pyproject.toml', 'setup.cfg', 'tox.ini') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Docker and the Compose v2 plugin are pre-installed on ubuntu-latest;
      # the harness needs no ZK/Java/krb5 installation on the host (FR-001/011).
      - name: Verify docker compose
        run: docker compose version

      - name: Install required dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install libevent-dev krb5-kdc krb5-admin-server libkrb5-dev
          python3 -m pip install --upgrade pip
          pip install -e '.[test]'

      - name: Test with pytest (plain axis)
        run: pytest kazoo/tests/ -q --cov-report=xml --cov=kazoo
        env:
          # ZK_VERSION drives the docker-compose harness; ZOOKEEPER_VERSION is
          # the legacy env for the CI_ZK_VERSION test gates.
          ZK_VERSION: ${{ matrix.zk-version }}
          ZOOKEEPER_VERSION: ${{ matrix.zk-version }}
          ZK_AUTH: plain
          ZK_FEATURES: standard

      - name: Publish Codecov report
        uses: codecov/codecov-action@v4

  test_axes:
    needs: [validate]

    # Auth (digest, sasl_digest, tls, sasl_gssapi) and feature (ttl, reconfig)
    # axes on the latest Python target (FR-017/SC-007). The SASL axes enforce
    # auth on the ensemble; the sasl_gssapi leg additionally needs a host
    # Kerberos client: kinit (krb5-user) plus libkrb5-dev to build the
    # pykerberos module (no Linux wheels exist for it; T037 decision).
    name: >
      Linux - Axis ${{ matrix.axis }}
      (Python ${{ matrix.python-version }}, ZK ${{ matrix.zk-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - axis: digest
            python-version: "3.14"
            zk-version: "3.9.5"
            zk-auth: digest
            zk-features: standard
          - axis: sasl_digest
            python-version: "3.14"
            zk-version: "3.9.5"
            zk-auth: sasl_digest
            zk-features: standard
          - axis: tls
            python-version: "3.14"
            zk-version: "3.9.5"
            zk-auth: tls
            zk-features: standard
          - axis: sasl_gssapi
            python-version: "3.14"
            zk-version: "3.9.5"
            zk-auth: sasl_gssapi
            zk-features: standard
          - axis: ttl
            python-version: "3.14"
            zk-version: "3.9.5"
            zk-auth: plain
            zk-features: ttl
          - axis: reconfig
            python-version: "3.14"
            zk-version: "3.9.5"
            zk-auth: plain
            zk-features: reconfig
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Handle pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', 'pyproject.toml', 'setup.cfg', 'tox.ini') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Verify docker compose
        run: docker compose version

      # Host Kerberos client for the sasl_gssapi axis: kinit must be on PATH
      # (kazoo_ensemble.py invokes it for the KDC sidecar) and libkrb5-dev is
      # required to compile the `kerberos` python module from sdist.
      - name: Install Kerberos client tools
        if: matrix.axis == 'sasl_gssapi'
        run: |
          sudo apt-get -y install krb5-user libkrb5-dev

      - name: Install required dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -e '.[test]'
          if [ "${{ matrix.axis }}" = "sasl_gssapi" ]; then pip install kerberos; fi

      - name: Test with pytest (${{ matrix.axis }} axis)
        run: pytest kazoo/tests/ -q
        env:
          ZK_VERSION: ${{ matrix.zk-version }}
          ZOOKEEPER_VERSION: ${{ matrix.zk-version }}
          ZK_AUTH: ${{ matrix.zk-auth }}
          ZK_FEATURES: ${{ matrix.zk-features }}

  test_windows:
    needs: [validate]
    name: Windows - Sanity test using a single version of Python and ZK

    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Handle pip cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', 'pyproject.toml', 'setup.cfg', 'tox.ini') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Docker is pre-installed on windows-latest; the harness only needs the
      # docker CLI with the Compose v2 plugin (FR-011). The Windows job runs the
      # plain auth/feature axis against the fixed default ZK version to prove
      # multiplatform behavior (US4); the tiered auth/feature matrix runs on the
      # Linux job (FR-017).
      - name: Verify docker compose
        shell: pwsh
        run: docker compose version

      - name: Install required dependencies
        shell: bash
        run: |
          python3 -m pip install --upgrade pip
          pip install -e '.[test]'

      - name: Test with pytest (plain axis)
        shell: bash
        run: pytest kazoo/tests/integ -q
        env:
          ZK_AUTH: plain
          ZK_FEATURES: standard
